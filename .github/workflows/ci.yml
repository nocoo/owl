# CI slot standard v1.3.0 (system1-quality): macOS native slots via repo reusable workflow.
# Caller job key `quality` yields canonical checks: quality / S1: Typecheck, ... quality / Z1: Gate.
# nocoo/base-ci v2026.15 pin: 777bbe4f9bacab8a91d8c01974480a6ee23d28e0 (composite action in quality-slots.yml only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
