# CI slot standard v1 (nocoo/base-ci docs/slots.md): macOS native slots via repo reusable workflow.
# Caller job key `quality` yields canonical checks: quality / S1: Typecheck, … quality / Z1: Gate.
# nocoo/base-ci v2026.12 pin: 1ea10ecab22b72512399485391603fe03a161016 (composite action in native-quality.yml only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/native-quality.yml
