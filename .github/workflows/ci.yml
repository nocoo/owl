name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runner: "macos-26"
      runtime: "none"
      timeout-minutes: 15
      pre-command: |
        brew install swiftlint
        swiftlint lint --strict
      command: |
        swift build
        swift test --enable-code-coverage --filter 'OwlCoreTests' --skip 'EndToEnd' --skip 'SystemMetricsPoller' --skip 'LogStreamReader' --skip 'TopProcessProvider' --skip 'ProcessStatsProvider' --skip 'BatteryProvider' --skip 'SMCTemperature' --skip 'HIDTemperature'

  security:
    uses: nocoo/base-ci/.github/workflows/security.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      gitleaks-config: ".gitleaks.toml"
      scan-history: true
      scan-dependencies: false
