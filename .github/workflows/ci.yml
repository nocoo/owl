name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runner: "macos-26"
      runtime: "none"
      timeout-minutes: 15
      pre-command: |
        brew install swiftlint gitleaks
        npm install
        test -x .husky/pre-commit
        test "$(git config core.hooksPath)" = ".husky/_"
        swiftlint lint --strict
      command: |
        swift build
        swift test --enable-code-coverage --filter 'OwlCoreTests' --skip 'EndToEnd' --skip 'SystemMetricsPoller' --skip 'LogStreamReader' --skip 'TopProcessProvider' --skip 'ProcessStatsProvider' --skip 'BatteryProvider' --skip 'SMCTemperature' --skip 'HIDTemperature'

  security:
    uses: nocoo/base-ci/.github/workflows/security.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      gitleaks-config: ".gitleaks.toml"
      scan-history: true
      scan-dependencies: false
