# CI slot standard v1.3.0 (system1-quality): macOS native slots via repo reusable workflow.
# Caller job key `quality` yields canonical checks: quality / S1: Types, ... quality / Z1: Gate.
# nocoo/base-ci v2026.18 pin: bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c (composite action in quality-slots.yml only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
