# CI slot standard v1.3.0 (system1-quality): macOS native slots via repo reusable workflow.
# Caller job key `quality` yields canonical checks: quality / S1: Typecheck, ... quality / Z1: Gate.
# nocoo/base-ci v2026.16 pin: 6424d395d36a815d931f10e557762eb635d511c0 (composite action in quality-slots.yml only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
