# CI slot standard v1.3.0 (system1-quality): canonical job names for GitHub checks (quality / S1: Types, ...).
# macOS Swift toolchain inlined — not nocoo/base-ci quality.yml (ubuntu-only).
name: Native quality slots

on:
  workflow_call:
    outputs:
      tested-sha:
        description: Commit SHA verified by quality gate
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

permissions:
  contents: read

jobs:
  s1-typecheck:
    name: "S1: Types"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-debug-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: ${{ runner.os }}-swift-debug-
      - name: Typecheck
        shell: bash
        run: swift build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/swiftlint
          key: ${{ runner.os }}-swiftlint-0.65.1
      - name: Install verified SwiftLint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/share/swiftlint"
          echo "${HOME}/.local/share/swiftlint" >> "$GITHUB_PATH"
          export PATH="${HOME}/.local/share/swiftlint:${PATH}"
          if ! command -v swiftlint >/dev/null || [ "$(swiftlint version)" != "0.65.1" ]; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
            echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  /tmp/swiftlint.zip" | shasum -a 256 -c -
            rm -rf "${HOME}/.local/share/swiftlint"
            mkdir -p "${HOME}/.local/share/swiftlint"
            unzip -q /tmp/swiftlint.zip -d "${HOME}/.local/share/swiftlint"
          fi
          test "$(swiftlint version)" = "0.65.1"
      - name: Lint
        shell: bash
        run: swiftlint lint --strict
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow-lint:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secret-scan:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependency-vulnerabilities:
    name: "G2: Dependencies"
    if: ${{ vars.ENABLE_G2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — SwiftPM has no third-party dependencies; package-lock is Husky devDependency only"

  b1-build:
    name: "B1: Build"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-release-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: ${{ runner.os }}-swift-release-
      - name: Build
        shell: bash
        run: swift build -c release
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-tests:
    name: "L1: Unit"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-cov-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: ${{ runner.os }}-swift-cov-
      - name: Unit tests
        shell: bash
        run: |
          swift test --enable-code-coverage --filter 'OwlCoreTests' --skip 'EndToEnd' --skip 'SystemMetricsPoller' --skip 'LogStreamReader' --skip 'TopProcessProvider' --skip 'ProcessStatsProvider' --skip 'BatteryProvider' --skip 'SMCTemperature' --skip 'HIDTemperature'
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — not a Worker project"

  l3-integration:
    name: "L3: Integration"
    needs:
      - l1-unit-tests
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-swift-cov-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: ${{ runner.os }}-swift-cov-
      - name: Integration tests (EndToEnd)
        shell: bash
        run: swift test --enable-code-coverage --filter EndToEnd
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — native AppKit/SwiftUI menu-bar app, verified manually"

  p1-package-check:
    name: "P1: Package Check"
    if: ${{ vars.ENABLE_P1 == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "na — private package, SwiftPM executable not published to npm"

  z1-gate:
    name: "Z1: Gate"
    needs:
      - s1-typecheck
      - s2-lint
      - s3-workflow-lint
      - g1-secret-scan
      - g2-dependency-vulnerabilities
      - b1-build
      - l1-unit-tests
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Verify quality slots
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-typecheck=S1: Types
            s2-lint=S2: Lint
            s3-workflow-lint=S3: Workflow
            g1-secret-scan=G1: Secrets
            b1-build=B1: Build
            l1-unit-tests=L1: Unit
            l3-integration=L3: Integration
          skipped-jobs: |
            g2-dependency-vulnerabilities=G2: Dependencies
            l2-runtime=L2: Runtime
            l4-e2e=L4: E2E
            p1-package-check=P1: Package Check
